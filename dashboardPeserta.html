<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Calon Santri</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // API URL Google Apps Script yang sudah dipasang
        const API_URL = "https://script.google.com/macros/s/AKfycbxfRUW-F3ivvv1l1PUeKnzPdZkWVR6n4pBfcg7TbKhWUeeUzIdvHQGPplTRXKITDIsnjw/exec";

        const DashboardScreen = () => {
            const [session, setSession] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('home');
            const [dataServer, setDataServer] = React.useState(null);
            const [isLoadingData, setIsLoadingData] = React.useState(true);

            // Fungsi Satpam (Pengecekan Keamanan)
            React.useEffect(() => {
                const savedSession = localStorage.getItem('psb_session');
                if (!savedSession) {
                    // Jika tidak ada data sesi, tendang ke halaman login
                    window.location.href = 'index.html';
                    return;
                }
                
                const parsedSession = JSON.parse(savedSession);
                setSession(parsedSession);
                fetchData(parsedSession.user.noWa);
            }, []);

            const fetchData = async (noWa) => {
                setIsLoadingData(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'getDataPeserta', payload: { noWa: noWa } })
                    });
                    const res = await response.json();
                    if(res.success) {
                        setDataServer(res.dataUser);
                    }
                } catch(err) {
                    console.error("Gagal menarik data dari server.");
                } finally {
                    setIsLoadingData(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('psb_session');
                window.location.href = 'index.html'; // Kembali ke halaman login
            };

            // Tampilan Loading saat mengecek Sesi dan Data Server
            if (isLoadingData || !dataServer) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center text-green-600 flex-col gap-4">
                        <i className="fa-solid fa-circle-notch fa-spin text-4xl"></i>
                        <p className="font-semibold text-gray-600">Menarik data terbaru dari server...</p>
                    </div>
                );
            }

            // Logika Kunci Tab Ujian
            const isTesLocked = dataServer.statusPembayaran !== "Lunas" || dataServer.statusBerkas !== "Valid";

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row animate-fade-in">
                    {/* Sidebar */}
                    <div className="bg-green-800 text-white w-full md:w-64 flex flex-col">
                        <div className="p-4 border-b border-green-700 text-center">
                            <i className="fa-solid fa-graduation-cap text-3xl mb-2"></i>
                            <h2 className="font-bold">Dashboard Calon Santri</h2>
                            <p className="text-green-300 text-xs mt-1">{dataServer.jenjang} - {dataServer.gender}</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('home')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-left transition-colors ${activeTab === 'home' ? 'bg-green-600' : 'hover:bg-green-700'}`}>
                                <i className="fa-solid fa-house w-5 text-center"></i> Beranda
                            </button>
                            <button onClick={() => setActiveTab('biodata')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-left transition-colors ${activeTab === 'biodata' ? 'bg-green-600' : 'hover:bg-green-700'}`}>
                                <i className="fa-solid fa-address-card w-5 text-center"></i> Biodata Lengkap
                            </button>
                            <button onClick={() => setActiveTab('berkas')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-left transition-colors ${activeTab === 'berkas' ? 'bg-green-600' : 'hover:bg-green-700'}`}>
                                <i className="fa-solid fa-folder-open w-5 text-center"></i> Unggah Berkas
                            </button>
                            <button onClick={() => setActiveTab('pembayaran')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-left transition-colors ${activeTab === 'pembayaran' ? 'bg-green-600' : 'hover:bg-green-700'}`}>
                                <i className="fa-solid fa-wallet w-5 text-center"></i> Pembayaran
                            </button>
                            <button onClick={() => !isTesLocked && setActiveTab('tes')} className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-left transition-colors ${activeTab === 'tes' ? 'bg-green-600' : (isTesLocked ? 'opacity-50 cursor-not-allowed' : 'hover:bg-green-700')}`}>
                                <i className={`fa-solid w-5 text-center ${isTesLocked ? 'fa-lock' : 'fa-file-signature'}`}></i> Jadwal & Tes
                            </button>
                        </nav>
                        <div className="p-4 border-t border-green-700">
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-2 rounded text-red-300 hover:text-white hover:bg-red-600 transition-colors">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> Keluar
                            </button>
                        </div>
                    </div>

                    {/* Konten Utama */}
                    <div className="flex-1 p-6 overflow-y-auto">
                        <h1 className="text-2xl font-bold text-gray-800 mb-6">Halo, {dataServer.nama}!</h1>

                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-4">Status Pendaftaran Anda</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className={`p-4 rounded-lg border ${dataServer.statusPembayaran === 'Lunas' ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'}`}>
                                            <p className="text-sm text-gray-600">Status Pembayaran</p>
                                            <p className={`font-bold ${dataServer.statusPembayaran === 'Lunas' ? 'text-green-700' : 'text-yellow-700'}`}>{dataServer.statusPembayaran}</p>
                                        </div>
                                        <div className={`p-4 rounded-lg border ${dataServer.statusBerkas === 'Valid' ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'}`}>
                                            <p className="text-sm text-gray-600">Status Berkas</p>
                                            <p className={`font-bold ${dataServer.statusBerkas === 'Valid' ? 'text-green-700' : 'text-yellow-700'}`}>{dataServer.statusBerkas}</p>
                                        </div>
                                        <div className="p-4 rounded-lg border bg-blue-50 border-blue-200">
                                            <p className="text-sm text-gray-600">Hasil Akhir Kelulusan</p>
                                            <p className="font-bold text-blue-700">{dataServer.statusKelulusan}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-xl text-indigo-800 flex items-start gap-4">
                                    <i className="fa-solid fa-bullhorn text-2xl mt-1"></i>
                                    <div>
                                        <h3 className="font-bold">Pengumuman Terbaru</h3>
                                        <p className="text-sm mt-1">Selamat datang di Portal PSB. Segera lengkapi Biodata dan lakukan Pembayaran Pendaftaran agar Anda dapat mengikuti Tes Seleksi.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab !== 'home' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-center min-h-[300px] text-gray-500">
                                <p><i className="fa-solid fa-screwdriver-wrench mr-2"></i> Form {activeTab} sedang dalam perancangan...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardScreen />);
    </script>
</body>
</html>
