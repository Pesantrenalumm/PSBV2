<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal PSB Online - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API_URL = "https://script.google.com/macros/s/AKfycbxfRUW-F3ivvv1l1PUeKnzPdZkWVR6n4pBfcg7TbKhWUeeUzIdvHQGPplTRXKITDIsnjw/exec";

        const AuthScreen = () => {
            const [isLoginView, setIsLoginView] = React.useState(true);
            const [isLoading, setIsLoading] = React.useState(false);
            const [pesan, setPesan] = React.useState({ type: '', text: '' });
            const [showPassword, setShowPassword] = React.useState(false);

            const [loginData, setLoginData] = React.useState({ username: '', password: '' });
            const [regData, setRegData] = React.useState({
                namaLengkap: '', noWa: '', password: '', 
                jenisPendaftar: 'Santri Baru', jenjang: 'SMP', gender: 'Putra', kelasTambahan: ''
            });

            React.useEffect(() => { setPesan({ type: '', text: '' }); }, [isLoginView]);

            React.useEffect(() => {
                const session = localStorage.getItem('psb_session');
                if (session) {
                    const parsedSession = JSON.parse(session);
                    if (parsedSession.role === 'calon_santri') {
                        window.location.href = 'dashboardPeserta.html';
                    }
                }
            }, []);

            const callAPI = async (action, payload) => {
                setIsLoading(true);
                setPesan({ type: '', text: '' });
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    return await response.json();
                } catch (error) {
                    setPesan({ type: 'error', text: 'Gagal terhubung ke server. Periksa koneksi internet.' });
                    return null;
                } finally {
                    setIsLoading(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const res = await callAPI('login', loginData);
                if (res && res.success) {
                    localStorage.setItem('psb_session', JSON.stringify({ isLoggedIn: true, role: res.role, user: res.dataUser }));
                    setPesan({ type: 'success', text: 'Login berhasil! Mengalihkan...' });
                    setTimeout(() => {
                        if(res.role === 'calon_santri') window.location.href = 'dashboardPeserta.html';
                        else alert("Dashboard admin belum tersedia");
                    }, 1000);
                } else if (res) {
                    setPesan({ type: 'error', text: res.message });
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                const payload = { ...regData, kelasTambahan: regData.jenisPendaftar === 'Santri Baru' ? '-' : regData.kelasTambahan };
                const res = await callAPI('register', payload);
                if (res && res.success) {
                    setPesan({ type: 'success', text: res.message });
                    setTimeout(() => { setIsLoginView(true); }, 2500);
                } else if (res) {
                    setPesan({ type: 'error', text: res.message });
                }
            };

            return (
                <div className="min-h-screen flex">
                    {/* Panel Kiri (Informasi) - Disembunyikan di layar HP kecil */}
                    <div className="hidden md:flex md:w-5/12 bg-[#4f46e5] p-12 text-white flex-col justify-between relative overflow-hidden">
                        <div className="relative z-10">
                            <div className="flex items-center gap-3 mb-16">
                                <div className="bg-white text-[#4f46e5] p-2 rounded-lg">
                                    <i className="fa-solid fa-graduation-cap text-2xl"></i>
                                </div>
                                <div>
                                    <h2 className="font-bold text-xl leading-tight">ALUMM</h2>
                                    <p className="text-[10px] tracking-widest opacity-80">BOARDING SCHOOL</p>
                                </div>
                            </div>
                            
                            <h1 className="text-5xl font-extrabold mb-6 leading-tight">Portal<br/>Penerimaan<br/>Santri Baru<br/>2026</h1>
                            <p className="text-lg opacity-90 mb-12 max-w-sm">Mencetak generasi rabbani yang berakhlak mulia, berwawasan global, dan hafal Al-Qur'an.</p>

                            <div className="bg-white/10 border border-white/20 p-6 rounded-2xl backdrop-blur-sm max-w-sm">
                                <div className="flex items-center gap-3 mb-3">
                                    <i className="fa-solid fa-bullhorn text-yellow-300 text-xl"></i>
                                    <h3 className="font-bold text-lg">Informasi Penting</h3>
                                </div>
                                <p className="text-sm opacity-90 leading-relaxed">Pendaftaran Gelombang 1 dibuka hingga 30 Juli 2026. Pastikan Anda menyimpan username dan password dengan baik.</p>
                            </div>
                        </div>
                        
                        <div className="relative z-10 text-xs opacity-60 mt-12">
                            &copy; 2026 Yayasan Pendidikan ALUMM.<br/>All rights reserved.
                        </div>
                    </div>

                    {/* Panel Kanan (Formulir) */}
                    <div className="w-full md:w-7/12 flex items-center justify-center p-8 bg-white">
                        <div className="w-full max-w-md animate-fade-in">
                            {/* Logo untuk versi Mobile */}
                            <div className="md:hidden flex items-center gap-3 mb-10 text-[#4f46e5]">
                                <div className="bg-[#4f46e5] text-white p-2 rounded-lg"><i className="fa-solid fa-graduation-cap text-xl"></i></div>
                                <div><h2 className="font-bold text-lg leading-tight">ALUMM</h2><p className="text-[9px] tracking-widest">BOARDING SCHOOL</p></div>
                            </div>

                            {pesan.text && (
                                <div className={`p-4 rounded-xl mb-6 text-sm flex items-start gap-3 border ${pesan.type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                    <i className={`fa-solid mt-0.5 ${pesan.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
                                    <span className="font-medium">{pesan.text}</span>
                                </div>
                            )}

                            {isLoginView ? (
                                <div>
                                    <h2 className="text-3xl font-extrabold text-[#1e293b] mb-2">Masuk ke Akun Anda</h2>
                                    <p className="text-gray-500 mb-8">Masukkan username (No. WA) dan password terdaftar.</p>

                                    <form onSubmit={handleLogin} className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Nomor WhatsApp Aktif</label>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                                    <i className="fa-solid fa-phone"></i>
                                                </div>
                                                <input type="text" required placeholder="Contoh: 08123456789" className="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4f46e5] focus:border-[#4f46e5] transition-all bg-gray-50 focus:bg-white" value={loginData.username} onChange={e => setLoginData({...loginData, username: e.target.value})} />
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="block text-sm font-bold text-gray-700">Password</label>
                                                <a href="#" className="text-sm font-semibold text-[#4f46e5] hover:text-indigo-800">Lupa password?</a>
                                            </div>
                                            <div className="relative">
                                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                                    <i className="fa-solid fa-lock"></i>
                                                </div>
                                                <input type={showPassword ? "text" : "password"} required placeholder="••••••••" className="w-full pl-11 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#4f46e5] focus:border-[#4f46e5] transition-all bg-gray-50 focus:bg-white" value={loginData.password} onChange={e => setLoginData({...loginData, password: e.target.value})} />
                                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600">
                                                    <i className={`fa-solid ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                                </button>
                                            </div>
                                        </div>
                                        <button type="submit" disabled={isLoading} className="w-full bg-[#4f46e5] hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition-all flex justify-center items-center gap-2 mt-2">
                                            {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-right-to-bracket"></i>} 
                                            {isLoading ? 'Memeriksa...' : 'Masuk Dashboard'}
                                        </button>
                                    </form>

                                    <div className="mt-10 pt-6 border-t border-gray-100 text-center">
                                        <p className="text-gray-600">Belum memiliki akun pendaftaran? <button onClick={() => setIsLoginView(false)} className="text-[#4f46e5] font-bold hover:underline">Daftar Santri Baru</button></p>
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <div className="flex items-center gap-3 mb-6">
                                        <button type="button" onClick={() => setIsLoginView(true)} className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors"><i className="fa-solid fa-arrow-left"></i></button>
                                        <h2 className="text-2xl font-extrabold text-[#1e293b]">Pendaftaran Akun</h2>
                                    </div>
                                    <form onSubmit={handleRegister} className="space-y-4 text-sm">
                                        <div>
                                            <label className="block font-bold text-gray-700 mb-2">Jalur Pendaftaran</label>
                                            <div className="grid grid-cols-3 gap-3">
                                                {['Santri Baru', 'Mutasi', 'Inden'].map((jenis) => (
                                                    <button key={jenis} type="button" onClick={() => setRegData({...regData, jenisPendaftar: jenis, kelasTambahan: ''})} className={`py-2.5 rounded-xl border-2 font-bold transition-all ${regData.jenisPendaftar === jenis ? 'bg-indigo-50 border-[#4f46e5] text-[#4f46e5]' : 'bg-white border-gray-100 text-gray-500 hover:border-gray-200'}`}>{jenis}</button>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block font-bold text-gray-700 mb-2">Jenjang</label>
                                                <div className="flex bg-gray-100 p-1 rounded-xl">
                                                    {['SMP', 'MA'].map((lvl) => (
                                                        <button key={lvl} type="button" onClick={() => setRegData({...regData, jenjang: lvl, kelasTambahan: ''})} className={`flex-1 py-2 rounded-lg font-bold transition-all ${regData.jenjang === lvl ? 'bg-white shadow-sm text-[#4f46e5]' : 'text-gray-500 hover:text-gray-700'}`}>{lvl}</button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block font-bold text-gray-700 mb-2">Jenis Kelamin</label>
                                                <div className="flex bg-gray-100 p-1 rounded-xl">
                                                    {['Putra', 'Putri'].map((jk) => (
                                                        <button key={jk} type="button" onClick={() => setRegData({...regData, gender: jk})} className={`flex-1 py-2 rounded-lg font-bold transition-all ${regData.gender === jk ? 'bg-white shadow-sm text-[#4f46e5]' : 'text-gray-500 hover:text-gray-700'}`}>{jk}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                        {regData.jenisPendaftar === 'Mutasi' && (
                                            <div>
                                                <label className="block font-bold text-gray-700 mb-1">Kelas Tujuan Mutasi</label>
                                                <select required className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#4f46e5]" value={regData.kelasTambahan} onChange={e => setRegData({...regData, kelasTambahan: e.target.value})}>
                                                    <option value="">-- Pilih Kelas --</option>
                                                    {regData.jenjang === 'SMP' ? (
                                                        <><option value="Kelas 7">Kelas 7</option><option value="Kelas 8">Kelas 8</option><option value="Kelas 9">Kelas 9</option></>
                                                    ) : (
                                                        <><option value="Kelas 10">Kelas 10</option><option value="Kelas 11">Kelas 11</option><option value="Kelas 12">Kelas 12</option></>
                                                    )}
                                                </select>
                                            </div>
                                        )}
                                        <div>
                                            <label className="block font-bold text-gray-700 mb-1 mt-2">Nama Lengkap Santri</label>
                                            <input type="text" required placeholder="Sesuai Akta Kelahiran" className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#4f46e5]" value={regData.namaLengkap} onChange={e => setRegData({...regData, namaLengkap: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-gray-700 mb-1">No. WhatsApp Aktif</label>
                                            <input type="text" required placeholder="08..." className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#4f46e5]" value={regData.noWa} onChange={e => setRegData({...regData, noWa: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-gray-700 mb-1">Buat Password</label>
                                            <input type="password" required placeholder="Minimal 6 karakter" className="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-[#4f46e5]" value={regData.password} onChange={e => setRegData({...regData, password: e.target.value})} />
                                        </div>
                                        <button type="submit" disabled={isLoading} className="w-full bg-[#4f46e5] hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl mt-6 shadow-lg shadow-indigo-200 transition-all">
                                            {isLoading ? <i className="fa-solid fa-circle-notch fa-spin mr-2"></i> : null}
                                            {isLoading ? 'Memproses...' : 'Daftar Akun Sekarang'}
                                        </button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthScreen />);
    </script>
</body>
</html>
